services:
  mysql-db:
    image: mysql:8.0
    container_name: blackbox-mysql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "7"
    env_file: .env
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - blackbox-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Запускается один раз после mysql-db, применяет новые миграции и завершается.
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: blackbox-migrate
    restart: "no"
    volumes:
      - ./migrations:/migrations:ro
    env_file: .env
    environment:
      DATABASE_HOST: mysql-db
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_NAME: ${MYSQL_DATABASE}
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - blackbox-net

  minio:
    image: minio/minio:latest
    container_name: blackbox-minio
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "7"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - blackbox-net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    build: ./scheduler
    container_name: blackbox-scheduler
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    volumes:
      - /:/host:ro
    env_file: .env
    environment:
      # network_mode: host — Docker DNS недоступен, используем 127.0.0.1
      DATABASE_HOST: "127.0.0.1"
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_NAME: ${MYSQL_DATABASE}
      MINIO_ENDPOINT: "127.0.0.1:9000"
    depends_on:
      mysql-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    network_mode: host

  api:
    build: ./api
    container_name: blackbox-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    env_file: .env
    environment:
      # network_mode: host — Docker DNS недоступен, используем 127.0.0.1
      DATABASE_HOST: "127.0.0.1"
      DATABASE_USER: ${MYSQL_USER}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}
      DATABASE_NAME: ${MYSQL_DATABASE}
      MINIO_ENDPOINT: "127.0.0.1:9000"
      SCHEDULER_TRIGGER_URL: "http://127.0.0.1:9090"
    depends_on:
      mysql-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    network_mode: host

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: blackbox-nginx
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    networks:
      - blackbox-net

volumes:
  mysql_data:
  minio_data:

networks:
  blackbox-net:
    driver: bridge
