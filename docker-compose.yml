services:
  mysql-db:
    image: mysql:8.0
    container_name: blackbox-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: blackbox
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - blackbox-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uappuser", "-papppassword"]
      timeout: 20s
      retries: 10
      start_period: 30s

  minio:
    image: minio/minio:latest
    container_name: blackbox-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    networks:
      - blackbox-net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  scheduler:
    build: ./scheduler
    container_name: blackbox-scheduler
    restart: unless-stopped
    volumes:
      - ./scheduler/configs:/app/configs
    environment:
      - USE_MINIO=true
      - DIFF_THRESHOLD=0.5
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET_NAME=blackbox-configs
      - MINIO_USE_SSL=false
    depends_on:
      mysql-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - blackbox-net

  api-web:
    build: ./api-web
    container_name: blackbox-api-web
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes: []
    environment:
      - USE_MINIO=true
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin123
      - MINIO_BUCKET_NAME=blackbox-configs
      - MINIO_USE_SSL=false
    depends_on:
      mysql-db:
        condition: service_healthy
      minio:
        condition: service_healthy
    networks:
      - blackbox-net

  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:8080}
    container_name: blackbox-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api-web
    networks:
      - blackbox-net

volumes:
  mysql_data:
  minio_data:

networks:
  blackbox-net:
    driver: bridge