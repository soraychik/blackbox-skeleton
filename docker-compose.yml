services:
  mysql-db:
    image: mysql:8.0
    container_name: blackbox-mysql
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "7"
    env_file: .env
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - blackbox-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u${MYSQL_USER}", "-p${MYSQL_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: blackbox-migrate
    restart: "no"
    volumes:
      - ./migrations:/migrations:ro
    env_file: .env
    environment:
      DATABASE_HOST: mysql-db
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - blackbox-net

  minio:
    image: minio/minio:latest
    container_name: blackbox-minio
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "7"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - blackbox-net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 5s
      retries: 3

  scheduler:
    build: ./scheduler
    container_name: blackbox-scheduler
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    volumes:
      - /:/host:ro
    env_file: .env
    environment:
      DATABASE_HOST: mysql-db
      MINIO_ENDPOINT: "minio:9000"
    depends_on:
      mysql-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - blackbox-net

  api:
    build: ./api
    ports:
      - 8080:8080
    container_name: blackbox-api
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    env_file: .env
    environment:
      DATABASE_HOST: mysql-db
      MINIO_ENDPOINT: "minio:9000"
      SCHEDULER_TRIGGER_URL: "http://scheduler:9090"
    depends_on:
      mysql-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    networks:
      - blackbox-net

volumes:
  mysql_data:
  minio_data:

networks:
  blackbox-net:
    driver: bridge