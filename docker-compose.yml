services:
  mysql-db:
    image: mysql:8.0
    container_name: blackbox-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: blackbox
      MYSQL_USER: appuser
      MYSQL_PASSWORD: apppassword
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./sql-init/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - blackbox-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uappuser", "-papppassword"]
      timeout: 20s
      retries: 10
      start_period: 30s

  # Сервис миграций — запускается один раз после mysql-db, затем завершается.
  # Применяет только новые файлы из папки migrations/ (уже применённые пропускает).
  migrate:
    build:
      context: .
      dockerfile: Dockerfile.migrate
    container_name: blackbox-migrate
    restart: "no"
    volumes:
      - ./migrations:/migrations:ro
    environment:
      DATABASE_HOST: mysql-db
      DATABASE_PORT: "3306"
      DATABASE_USER: appuser
      DATABASE_PASSWORD: apppassword
      DATABASE_NAME: blackbox
    depends_on:
      mysql-db:
        condition: service_healthy
    networks:
      - blackbox-net

  minio:
    image: minio/minio:latest
    container_name: blackbox-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin123
    volumes:
      - minio_data:/data
    networks:
      - blackbox-net
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  scheduler:
    build: ./scheduler
    container_name: blackbox-scheduler
    restart: unless-stopped
    privileged: true
    cap_add:
      - SYS_ADMIN
    devices:
      - /dev/fuse
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /:/host:ro
    env_file:
      - .env
    environment:
      # При network_mode: host Docker DNS недоступен — подключаемся через хостовые порты
      DATABASE_HOST: "127.0.0.1"
      MINIO_ENDPOINT: "127.0.0.1:9000"
    depends_on:
      mysql-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    network_mode: host

  api:
    build: ./api
    container_name: blackbox-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # network_mode: host — используем 127.0.0.1 вместо Docker DNS имён
      DATABASE_HOST: "127.0.0.1"
      MINIO_ENDPOINT: "127.0.0.1:9000"
      SCHEDULER_TRIGGER_URL: "http://127.0.0.1:9090"
    depends_on:
      mysql-db:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    network_mode: host

  nginx:
    build:
      context: .
      dockerfile: nginx/Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-/api}
    container_name: blackbox-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - api
    networks:
      - blackbox-net

volumes:
  mysql_data:
  minio_data:

networks:
  blackbox-net:
    driver: bridge