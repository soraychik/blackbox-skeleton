# BlackBox — reverse proxy, статика, SPA fallback
# Единая точка входа: порт 80

worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" "$http_user_agent"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    # Сжатие текстового контента
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;
    gzip_min_length 1024;
    gzip_vary on;

    upstream api_backend {
        server host.docker.internal:8080;
    }

    server {
        listen 80;
        server_name localhost;
        root /usr/share/nginx/html;

        # Заголовки безопасности
        add_header X-Frame-Options          "DENY"                              always;
        add_header X-Content-Type-Options   "nosniff"                           always;
        add_header X-XSS-Protection         "1; mode=block"                     always;
        add_header Referrer-Policy          "strict-origin-when-cross-origin"   always;

        # Долгоживущий кэш для ассетов с хэшами в именах (Vite)
        location ~* ^/assets/ {
            expires 1y;
            add_header Cache-Control "public, immutable";
            add_header X-Frame-Options        "DENY"      always;
            add_header X-Content-Type-Options "nosniff"   always;
        }

        # Поиск — долгие запросы, до 3 минут
        location /api/search/ {
            rewrite ^/api(.*)$ $1 break;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_connect_timeout 10s;
            proxy_send_timeout    180s;
            proxy_read_timeout    180s;
        }

        # Всё остальное API
        location /api/ {
            rewrite ^/api(.*)$ $1 break;
            proxy_pass http://api_backend;
            proxy_http_version 1.1;
            proxy_set_header Host               $host;
            proxy_set_header X-Real-IP          $remote_addr;
            proxy_set_header X-Forwarded-For    $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto  $scheme;
            proxy_connect_timeout 30s;
            proxy_send_timeout    30s;
            proxy_read_timeout    30s;
        }

        # Health check
        location /health {
            proxy_pass http://api_backend/health;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
        }

        # Frontend SPA — try_files с fallback на index.html
        location / {
            index index.html;
            try_files $uri $uri/ /index.html;
        }
    }
}
